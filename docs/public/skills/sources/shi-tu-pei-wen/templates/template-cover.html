<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>实图配文 · 左文右图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #e8e2d4; }
  .card {
    width: 2100px; height: 900px;
    display: flex;
    background: #f5efe3;
    font-family: "Noto Sans CJK SC", "PingFang SC", sans-serif;
    overflow: hidden;
  }
  .text {
    flex: 1.15;
    padding: 84px 88px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .rule { width: 120px; height: 10px; background: #b23a2a; }
  h1 {
    font-family: "Noto Serif CJK SC", "Songti SC", serif;
    font-weight: 700;
    font-size: 96px;
    line-height: 1.28;
    color: #1c1a17;
    margin-top: 40px;
    letter-spacing: 2px;
  }
  .credit {
    margin-top: 56px;
    font-size: 28px;
    line-height: 1.5;
    color: #6b655a;
  }
  .photo { flex: 1; position: relative; overflow: hidden; }
  .photo img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
</style>
</head>
<body>
<div class="card">
  <div class="text">
    <div class="rule"></div>
    <h1><!-- TITLE --></h1>
    <div class="credit"><!-- CREDIT --></div>
  </div>
  <div class="photo"><img src="<!-- PHOTO -->" alt=""></div>
</div>
</body>
</html>
