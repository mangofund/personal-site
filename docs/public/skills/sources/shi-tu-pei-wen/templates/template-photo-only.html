<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>实图配文 · 无文字纯图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; }
  .card {
    width: 2100px; height: 900px;
    overflow: hidden;
    position: relative;
  }
  .card img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
</style>
</head>
<body>
<div class="card"><img src="<!-- PHOTO -->" alt=""></div>
</body>
</html>
