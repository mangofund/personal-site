<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>50bp 的概率一天涨了 14 个百分点</title>
<meta name="description" content="50bp 的概率一天涨了 14 个百分点" />
<link rel="canonical" href="https://promangofund.com/charts/fedwatch-before-after.html" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F0EFEB;--ink:#1C1C1A;--muted:#8F8E88;--faint:#C6C5BF;--grid:#DEDDD6}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);font-family:'Inter',sans-serif;color:var(--ink);padding:28px 32px;-webkit-font-smoothing:antialiased}
  .card{background:var(--bg);border-radius:24px;padding:28px 28px 20px;max-width:860px;margin:0 auto}
  h2{font-weight:700;font-size:16.5px;letter-spacing:-.02em;margin-bottom:3px}
  .sub{font-size:11.5px;color:var(--muted);margin-bottom:14px}
  .src{font-size:9.5px;color:var(--faint);margin-top:10px;letter-spacing:.08em;font-weight:500}
  svg{width:100%;max-height:330px;display:block;margin:0 auto}
  svg text{font-family:'Inter',sans-serif}
  .pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.7,.3,1.3) both}
  @keyframes pop{from{transform:scale(0)}to{transform:none}}
  .fade{animation:fade .9s ease both}
  @keyframes fade{from{opacity:0}}
</style>
</head>
<body>
<div class="card">
  <h2>50bp 的概率一天涨了 14 个百分点</h2>
  <div class="sub">CME FedWatch · 12 月会议 · CPI 公布前后 · 一珠 = 一个百分点 · 空心 = 公布前 · 实心 = 公布后</div>
  <svg id="dumbbell" viewBox="0 0 400 320" preserveAspectRatio="xMidYMid meet"></svg>
  <div class="src">DUMBBELL QUEUE · MONO-BASIC · CME FEDWATCH</div>
</div>
<script>
const NS='http://www.w3.org/2000/svg';
const INK='#1C1C1A',PAPER='#F0EFEB',MUTED='#8F8E88',GRID='#DEDDD6';
const el=(p,t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);p.appendChild(n);return n};
const txt=(p,a,s)=>{const n=el(p,'text',a);n.textContent=s;return n};
const tip=(n,s)=>{const t=document.createElementNS(NS,'title');t.textContent=s;n.appendChild(t)};
const rnd=(i,k)=>Math.abs(((i*73856093)^(k*19349663))%1000)/1000;
const obsReveal=(id,fn)=>{
  const n=document.getElementById(id);
  const go=()=>{n.innerHTML='';fn(n)};
  const io=new IntersectionObserver(es=>{if(es[0].isIntersecting){go();io.disconnect()}},{threshold:.3});
  io.observe(n);
  n.style.cursor='pointer';
  n.addEventListener('click',go);
};

// ════ F12 · dumbbell queue — FedWatch December odds, before vs after CPI ════
// 哑铃对比：空心点 = CPI 公布前，实心点 = CPI 公布后，两点之间的轨道上串珠，
// 一珠 = 一个百分点。25bp 向左走 14.2 个点，50bp 向右走 14.2 个点，不加息钉在 0%。
(()=>{
const D=[['不加息',0,0],['加息 25bp',98.9,84.7],['加息 50bp',1.1,15.3]];
obsReveal('dumbbell',s=>{
  const y0=i=>56+i*46,X0=118,X1=364,mapX=v=>X0+v/100*(X1-X0);
  D.forEach(([name,was,now],i)=>{
    const y=y0(i),xa=mapX(was),xb=mapX(now);
    txt(s,{x:108,y:y+3,'font-size':7.5,'font-weight':700,fill:'#6A6963','text-anchor':'end',
      'letter-spacing':'.06em',class:'fade',style:`animation-delay:${i*.08}s`},name);
    el(s,'line',{x1:X0-6,y1:y,x2:X1+6,y2:y,stroke:'#E3E2DB','stroke-width':.7,
      class:'fade',style:`animation-delay:${i*.08}s`});
    // beads: one per percentage point repriced, strung between the two dots
    const n=Math.round(Math.abs(now-was));
    for(let k=0;k<n;k++){
      const t=(k+.5)/n,x=xb+t*(xa-xb),yy=y+(rnd(k+1,i+3)-.5)*2.6;
      el(s,'circle',{cx:x,cy:yy,r:1.5+rnd(k+2,i+4)*.9,fill:'#8F8E88',opacity:.85,
        class:'pop',style:`animation-delay:${.3+i*.08+k*.03}s`});
    }
    el(s,'circle',{cx:xa,cy:y,r:4.2,fill:PAPER,stroke:INK,'stroke-width':1.3,
      class:'pop',style:`animation-delay:${.2+i*.08}s`});
    const after=el(s,'circle',{cx:xb,cy:y,r:4.6,fill:INK,
      class:'pop',style:`animation-delay:${.6+i*.08}s`});
    tip(after,`${name} — ${was}% → ${now}%`);
    // value labels, both end-anchored above their dots; row 0 has one label only
    if(i===0){
      txt(s,{x:xa-8,y:y-8,'font-size':8.5,'font-weight':700,fill:'#B0AFA9','text-anchor':'end',
        class:'fade',style:`animation-delay:${.3+i*.08}s`},'0%');
    }else{
      txt(s,{x:xa-8,y:y-8,'font-size':8.5,'font-weight':700,fill:'#B0AFA9','text-anchor':'end',
        class:'fade',style:`animation-delay:${.3+i*.08}s`},was+'%');
      txt(s,{x:xb-8,y:y-8,'font-size':10,'font-weight':800,fill:INK,'text-anchor':'end',
        class:'fade',style:`animation-delay:${.7+i*.08}s`},now+'%');
    }
  });
  // 0–100 axis ticks
  [0,25,50,75,100].forEach(v=>{
    const x=mapX(v);
    el(s,'line',{x1:x,y1:196,x2:x,y2:202,stroke:'#CFCEC7','stroke-width':.6,class:'fade'});
    txt(s,{x:x,y:214,'font-size':7,'font-weight':600,fill:MUTED,'text-anchor':'middle',
      'letter-spacing':'.08em',class:'fade'},v+'%');
  });
  txt(s,{x:200,y:306,'font-size':7,'font-weight':600,fill:'#B0AFA9','text-anchor':'middle',
    'letter-spacing':'.12em',class:'fade',style:`animation-delay:1s`},
    'ONE BEAD = ONE PERCENTAGE POINT · HOLLOW = BEFORE CPI · INK = AFTER CPI');
});
})();
</script>
</body>
</html>
