<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>科创50领涨3.11%，11月2日是普涨日</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F0EFEB;--dark:#1C1C1A;--ink:#1C1C1A;--muted:#8F8E88;--faint:#C6C5BF;--grid:#DEDDD6}
body{background:var(--bg);font-family:'Inter',sans-serif;color:var(--ink);padding:40px;-webkit-font-smoothing:antialiased}
.card{background:var(--bg);border-radius:24px;padding:28px 28px 20px;max-width:520px;margin:0 auto}
h2{font-weight:700;font-size:16.5px;letter-spacing:-.02em;margin-bottom:3px}
.sub{font-size:11.5px;color:var(--muted);margin-bottom:14px;line-height:1.6}
.src{font-size:9.5px;color:var(--faint);margin-top:10px;letter-spacing:.08em;font-weight:500}
svg text{font-family:'Inter',sans-serif}
@keyframes fade{from{opacity:0}to{opacity:1}}
.fade{animation:fade .5s ease both}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
</style>
<meta name="description" content="科创50领涨3.11%，11月2日是普涨日" />
<link rel="canonical" href="https://promangofund.com/charts/manhua-index-gains.html" />
</head>
<body>
<div class="card">
  <h2>科创50领涨3.11%，11月2日是普涨日</h2>
  <div class="sub">11月2日收盘涨幅 · 1档 = 0.1百分点 · 档数按0.1百分点取整，顶端数字为精确值</div>
  <svg id="rungs" viewBox="0 0 400 320" preserveAspectRatio="xMidYMid meet"></svg>
  <div class="src">F1 RUNG BARS · MONO-BASIC · 财联社与中证报口径的11月2日收盘报道</div>
</div>
<script>
const INK='#1C1C1A',PAPER='#F0EFEB',MUTED='#8F8E88',GRID='#DEDDD6';
const NS='http://www.w3.org/2000/svg';
const el=(p,t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);p.appendChild(n);return n};
const txt=(p,a,s)=>{const n=el(p,'text',a);n.textContent=s;return n};
const tip=(n,s)=>{const t=document.createElementNS(NS,'title');t.textContent=s;n.appendChild(t)};
const rnd=(i,k)=>Math.abs(((i*73856093)^(k*19349663))%1000)/1000;
const obsReveal=(id,fn)=>{
  const n=document.getElementById(id);
  const go=()=>{n.innerHTML='';fn(n)};
  const io=new IntersectionObserver(es=>{if(es[0].isIntersecting){go();io.disconnect()}},{threshold:.3});
  io.observe(n);
  n.style.cursor='pointer';
  n.addEventListener('click',go);
};
// ── 数据：草稿“图表数据点”·11月2日指数涨幅 ──
const D=[['上证指数',1.08,11],['深证成指',1.63,16],['创业板指',1.87,19],['科创50',3.11,31],['北证50',0.58,6]];
obsReveal('rungs',s=>{
  const x0=i=>56+i*56,base=266,step=5.6,HW=14;
  D.forEach(([name,v,rungs],i)=>{
    const x=x0(i);
    for(let k=0;k<rungs;k++){
      const y=base-k*step,w=HW-1.5+rnd(k+1,i+2)*3;
      el(s,'line',{x1:x-w,y1:y,x2:x+w,y2:y,stroke:INK,'stroke-width':1,
        opacity:.5+rnd(k+2,i+4)*.5,class:'fade',style:`animation-delay:${i*.08+k*.012}s`});
      if(k%5===4)el(s,'circle',{cx:x+HW+4.5,cy:y,r:.8,fill:'#C6C5BF',
        class:'fade',style:`animation-delay:${i*.08+k*.012}s`});
    }
    const topY=base-(rungs-1)*step;
    const num=txt(s,{x,y:topY-10,'font-size':11,'font-weight':800,fill:INK,'text-anchor':'middle',
      class:'fade',style:`animation-delay:${.4+i*.08}s`},v.toFixed(2)+'%');
    tip(num,`${name} — ${v.toFixed(2)}%`);
    txt(s,{x,y:base+18,'font-size':8,'font-weight':700,fill:MUTED,'text-anchor':'middle',
      'letter-spacing':'.02em',class:'fade',style:`animation-delay:${i*.08}s`},name);
  });
  el(s,'line',{x1:28,y1:base+4,x2:372,y2:base+4,stroke:GRID,'stroke-width':.8,class:'fade'});
  txt(s,{x:200,y:306,'font-size':7,'font-weight':600,fill:'#B0AFA9','text-anchor':'middle',
    'letter-spacing':'.08em',class:'fade',style:'animation-delay:.9s'},
    'ONE RUNG = 0.1百分点 · 档数取整，顶端数字为精确值');
});
</script>
</body>
</html>
