<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>传媒7.77%领跑31个行业，数字媒体冲到11.32%</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F0EFEB;--dark:#1C1C1A;--ink:#1C1C1A;--muted:#8F8E88;--faint:#C6C5BF;--grid:#DEDDD6}
body{background:var(--bg);font-family:'Inter',sans-serif;color:var(--ink);padding:40px;-webkit-font-smoothing:antialiased}
.card{background:var(--bg);border-radius:24px;padding:28px 28px 20px;max-width:520px;margin:0 auto}
h2{font-weight:700;font-size:16.5px;letter-spacing:-.02em;margin-bottom:3px}
.sub{font-size:11.5px;color:var(--muted);margin-bottom:14px;line-height:1.6}
.src{font-size:9.5px;color:var(--faint);margin-top:10px;letter-spacing:.08em;font-weight:500}
svg text{font-family:'Inter',sans-serif}
@keyframes fade{from{opacity:0}to{opacity:1}}
.fade{animation:fade .5s ease both}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
</style>
<meta name="description" content="传媒7.77%领跑31个行业，数字媒体冲到11.32%" />
<link rel="canonical" href="https://promangofund.com/charts/manhua-sector-gains.html" />
</head>
<body>
<div class="card">
  <h2>传媒7.77%领跑31个行业，数字媒体冲到11.32%</h2>
  <div class="sub">11月2日申万一级传媒板块及细分方向涨幅，计算机为另一一级行业作对照 · 1 tick = 0.5百分点 · tick数按0.5百分点取整，行尾数字为精确值</div>
  <svg id="tickrows" viewBox="0 0 400 320" preserveAspectRatio="xMidYMid meet"></svg>
  <div class="src">F5 TICK ROWS · MONO-BASIC · 上海证券报与MOOMOO的11月2日收盘复盘</div>
</div>
<script>
const INK='#1C1C1A',PAPER='#F0EFEB',MUTED='#8F8E88',GRID='#DEDDD6';
const NS='http://www.w3.org/2000/svg';
const el=(p,t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);p.appendChild(n);return n};
const txt=(p,a,s)=>{const n=el(p,'text',a);n.textContent=s;return n};
const tip=(n,s)=>{const t=document.createElementNS(NS,'title');t.textContent=s;n.appendChild(t)};
const rnd=(i,k)=>Math.abs(((i*73856093)^(k*19349663))%1000)/1000;
const obsReveal=(id,fn)=>{
  const n=document.getElementById(id);
  const go=()=>{n.innerHTML='';fn(n)};
  const io=new IntersectionObserver(es=>{if(es[0].isIntersecting){go();io.disconnect()}},{threshold:.3});
  io.observe(n);
  n.style.cursor='pointer';
  n.addEventListener('click',go);
};
// ── 数据：草稿“图表数据点”·板块涨幅 ──
const D=[['数字媒体',11.32,23],['影视院线',10.02,20],['游戏',8.28,17],['传媒板块',7.77,16],['电视广播',6.30,13],['计算机',4.96,10]];
obsReveal('tickrows',s=>{
  const y0=i=>52+i*44,X0=104,PX=6.9;
  D.forEach(([name,v,ticks],i)=>{
    const y=y0(i);
    txt(s,{x:94,y:y+3,'font-size':9,'font-weight':700,fill:'#6A6963','text-anchor':'end',
      class:'fade',style:`animation-delay:${i*.08}s`},name);
    el(s,'line',{x1:X0,y1:y+9,x2:X0+24*PX,y2:y+9,stroke:GRID,'stroke-width':.6,
      class:'fade',style:`animation-delay:${i*.08}s`});
    for(let k=0;k<ticks;k++){
      const x=X0+k*PX+PX/2,h=9+rnd(k+1,i+2)*6;
      el(s,'line',{x1:x,y1:y+9,x2:x,y2:y+9-h,stroke:INK,'stroke-width':.9,
        opacity:.55+rnd(k+3,i+5)*.45,class:'fade',style:`animation-delay:${i*.08+k*.012}s`});
      if(k%5===4)el(s,'circle',{cx:x,cy:y+13,r:.8,fill:'#C6C5BF',
        class:'fade',style:`animation-delay:${i*.08+k*.012}s`});
    }
    const lab=txt(s,{x:X0+ticks*PX+10,y:y+4,'font-size':11,'font-weight':800,fill:INK,
      class:'fade',style:`animation-delay:${.4+i*.08}s`},v.toFixed(2)+'%');
    tip(lab,`${name} — ${v.toFixed(2)}%`);
  });
  txt(s,{x:200,y:308,'font-size':7,'font-weight':600,fill:'#B0AFA9','text-anchor':'middle',
    'letter-spacing':'.08em',class:'fade',style:'animation-delay:.9s'},
    'ONE TICK = 0.5百分点 · tick数取整，行尾数字为精确值');
});
</script>
</body>
</html>
