<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>核心 CPI 第三次钉在 0.3%</title>
<meta name="description" content="核心 CPI 第三次钉在 0.3%" />
<link rel="canonical" href="https://promangofund.com/charts/cpi-monthly-hairline.html" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F0EFEB;--ink:#1C1C1A;--muted:#8F8E88;--faint:#C6C5BF;--grid:#DEDDD6}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);font-family:'Inter',sans-serif;color:var(--ink);padding:28px 32px;-webkit-font-smoothing:antialiased}
  .card{background:var(--bg);border-radius:24px;padding:28px 28px 20px;max-width:860px;margin:0 auto}
  h2{font-weight:700;font-size:16.5px;letter-spacing:-.02em;margin-bottom:3px}
  .sub{font-size:11.5px;color:var(--muted);margin-bottom:14px}
  .src{font-size:9.5px;color:var(--faint);margin-top:10px;letter-spacing:.08em;font-weight:500}
  svg{width:100%;max-height:330px;display:block;margin:0 auto}
  svg text{font-family:'Inter',sans-serif}
  .pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.7,.3,1.3) both}
  @keyframes pop{from{transform:scale(0)}to{transform:none}}
  .fade{animation:fade .9s ease both}
  @keyframes fade{from{opacity:0}}
  .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s cubic-bezier(.4,0,.2,1) both}
  @keyframes draw{to{stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="card">
  <h2>核心 CPI 第三次钉在 0.3%</h2>
  <div class="sub">2026 年 8–10 月环比 · 季调后 · 整体 CPI 实线 · 核心 CPI 灰线 · 来源：美国劳工统计局</div>
  <svg id="dayline" viewBox="0 0 400 320" preserveAspectRatio="xMidYMid meet"></svg>
  <div class="src">HAIRLINE LINE · MONO-BASIC · BLS CPI</div>
</div>
<script>
const NS='http://www.w3.org/2000/svg';
const INK='#1C1C1A',PAPER='#F0EFEB',MUTED='#8F8E88',GRID='#DEDDD6';
const el=(p,t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);p.appendChild(n);return n};
const txt=(p,a,s)=>{const n=el(p,'text',a);n.textContent=s;return n};
const tip=(n,s)=>{const t=document.createElementNS(NS,'title');t.textContent=s;n.appendChild(t)};
const rnd=(i,k)=>Math.abs(((i*73856093)^(k*19349663))%1000)/1000;
const obsReveal=(id,fn)=>{
  const n=document.getElementById(id);
  const go=()=>{n.innerHTML='';fn(n)};
  const io=new IntersectionObserver(es=>{if(es[0].isIntersecting){go();io.disconnect()}},{threshold:.3});
  io.observe(n);
  n.style.cursor='pointer';
  n.addEventListener('click',go);
};

// ════ F2 · hairline line — CPI monthly, headline vs core, Aug–Oct 2026 ════
// 两条发丝线：整体 CPI 上下走（0.4 → 0.6 → 0.4），核心 CPI 一条横线钉在 0.3%。
// 横线本身就是结论。逐月圆点标数，图例在左上。
(()=>{
const MONTHS=['8 月','9 月','10 月'];
const HEAD=[0.4,0.6,0.4];
const CORE=[0.3,0.3,0.3];
obsReveal('dayline',s=>{
  const x=i=>90+i*110,base=250,top=60,map=v=>base-v/0.7*(base-top);
  // y grid, 0.1 steps
  for(let g=0;g<=7;g++){
    const v=g*0.1,y=map(v);
    el(s,'line',{x1:56,y1:y,x2:344,y2:y,stroke:g===0?GRID:'#EDECE7','stroke-width':.7,
      class:'fade',style:`animation-delay:${g*.03}s`});
    txt(s,{x:50,y:y+3,'font-size':7,'font-weight':600,fill:MUTED,'text-anchor':'end',
      class:'fade',style:`animation-delay:${g*.03}s`},v.toFixed(1)+'%');
  }
  // legend, top left
  el(s,'line',{x1:60,y1:34,x2:78,y2:34,stroke:INK,'stroke-width':1.4,class:'fade'});
  txt(s,{x:82,y:37,'font-size':7.5,'font-weight':700,fill:INK,class:'fade'},'整体 CPI');
  el(s,'line',{x1:150,y1:34,x2:168,y2:34,stroke:'#6A6963','stroke-width':1.4,class:'fade'});
  txt(s,{x:172,y:37,'font-size':7.5,'font-weight':700,fill:'#6A6963',class:'fade'},'核心 CPI');
  // headline hairline
  const ptsH=HEAD.map((v,i)=>`${x(i)} ${map(v)}`).join(' L ');
  el(s,'path',{d:'M'+ptsH,fill:'none',stroke:INK,'stroke-width':1.4,pathLength:1,
    class:'draw',style:'animation-duration:1.2s'});
  HEAD.forEach((v,i)=>{
    const dot=el(s,'circle',{cx:x(i),cy:map(v),r:3.6,fill:INK,
      class:'pop',style:`animation-delay:${.2+i*.15}s`});
    tip(dot,`${MONTHS[i]}整体 CPI — ${v.toFixed(1)}%`);
    txt(s,{x:x(i),y:map(v)-11,'font-size':10,'font-weight':800,fill:INK,'text-anchor':'middle',
      style:`paint-order:stroke;stroke:${PAPER};stroke-width:3px;animation-delay:${.5+i*.15}s`,
      class:'fade'},v.toFixed(1)+'%');
  });
  // core hairline, flat at 0.3%
  const ptsC=CORE.map((v,i)=>`${x(i)} ${map(v)}`).join(' L ');
  el(s,'path',{d:'M'+ptsC,fill:'none',stroke:'#6A6963','stroke-width':1.4,pathLength:1,
    class:'draw',style:'animation-duration:1.2s;animation-delay:.3s'});
  CORE.forEach((v,i)=>{
    const dot=el(s,'circle',{cx:x(i),cy:map(v),r:3.6,fill:PAPER,stroke:'#6A6963','stroke-width':1.3,
      class:'pop',style:`animation-delay:${.4+i*.15}s`});
    tip(dot,`${MONTHS[i]}核心 CPI — ${v.toFixed(1)}%`);
    txt(s,{x:x(i),y:map(v)+20,'font-size':10,'font-weight':800,fill:'#6A6963','text-anchor':'middle',
      style:`paint-order:stroke;stroke:${PAPER};stroke-width:3px;animation-delay:${.7+i*.15}s`,
      class:'fade'},v.toFixed(1)+'%');
  });
  // month ticks on the floor
  el(s,'line',{x1:56,y1:base,x2:344,y2:base,stroke:GRID,'stroke-width':.8,class:'fade'});
  MONTHS.forEach((m,i)=>
    txt(s,{x:x(i),y:base+18,'font-size':7.5,'font-weight':600,fill:MUTED,'text-anchor':'middle',
      'letter-spacing':'.1em',class:'fade'},m));
  txt(s,{x:200,y:306,'font-size':7,'font-weight':600,fill:'#B0AFA9','text-anchor':'middle',
    'letter-spacing':'.12em',class:'fade',style:`animation-delay:1.1s`},
    'CORE FLAT AT 0.3% FOR THREE MONTHS · HEADLINE FELL BACK TO 0.4%');
});
})();
</script>
</body>
</html>
