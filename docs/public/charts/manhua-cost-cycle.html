<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>一部漫剧的制作周期，从90天压到10天</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F0EFEB;--dark:#1C1C1A;--ink:#1C1C1A;--muted:#8F8E88;--faint:#C6C5BF;--grid:#DEDDD6}
body{background:var(--bg);font-family:'Inter',sans-serif;color:var(--ink);padding:40px;-webkit-font-smoothing:antialiased}
.card{background:var(--bg);border-radius:24px;padding:28px 28px 20px;max-width:520px;margin:0 auto}
h2{font-weight:700;font-size:16.5px;letter-spacing:-.02em;margin-bottom:3px}
.sub{font-size:11.5px;color:var(--muted);margin-bottom:14px;line-height:1.6}
.note{font-size:11px;color:#6A6963;line-height:1.65;margin-top:12px}
.src{font-size:9.5px;color:var(--faint);margin-top:10px;letter-spacing:.08em;font-weight:500}
svg text{font-family:'Inter',sans-serif}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.fade{animation:fade .5s ease both}
.pop{animation:pop .4s ease both}
@media (prefers-reduced-motion:reduce){.fade,.pop{animation:none}}
</style>
<meta name="description" content="一部漫剧的制作周期，从90天压到10天" />
<link rel="canonical" href="https://promangofund.com/charts/manhua-cost-cycle.html" />
</head>
<body>
<div class="card">
  <h2>一部漫剧的制作周期，从90天压到10天</h2>
  <div class="sub">单部制作周期 · 传统制作 vs AI漫剧 · 空心 = 传统制作 · 实心 = AI漫剧 · 1珠 = 省下的5天</div>
  <svg id="dumbbell" viewBox="0 0 400 320" preserveAspectRatio="xMidYMid meet"></svg>
  <div class="note">成本对照其余数字（文字注记，未进图）：AI漫剧单分钟制作成本最低350元、AI译制单部成本300–500元（较人工降低80%以上），均为快科技报道的企业自述最优值/区间，不是行业均值；一天批量上线约100部为央视财经采访的杭州企业负责人自述。区间值与混单位数字无法同轴编码，故不画成柱形。</div>
  <div class="src">F12 DUMBBELL QUEUE · MONO-BASIC · 快科技报道</div>
</div>
<script>
const INK='#1C1C1A',PAPER='#F0EFEB',MUTED='#8F8E88',GRID='#DEDDD6';
const NS='http://www.w3.org/2000/svg';
const el=(p,t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);p.appendChild(n);return n};
const txt=(p,a,s)=>{const n=el(p,'text',a);n.textContent=s;return n};
const tip=(n,s)=>{const t=document.createElementNS(NS,'title');t.textContent=s;n.appendChild(t)};
const rnd=(i,k)=>Math.abs(((i*73856093)^(k*19349663))%1000)/1000;
const obsReveal=(id,fn)=>{
  const n=document.getElementById(id);
  const go=()=>{n.innerHTML='';fn(n)};
  const io=new IntersectionObserver(es=>{if(es[0].isIntersecting){go();io.disconnect()}},{threshold:.3});
  io.observe(n);
  n.style.cursor='pointer';
  n.addEventListener('click',go);
};
// ── 数据：草稿“图表数据点”·成本对照（制作周期一对） ──
const NAME='单部制作周期', WAS=90, NOW=10; // 天
obsReveal('dumbbell',s=>{
  const y=150,X0=118,X1=364,mapX=v=>X0+v/100*(X1-X0);
  const xa=mapX(WAS),xb=mapX(NOW);
  txt(s,{x:108,y:y+3,'font-size':9,'font-weight':700,fill:'#6A6963','text-anchor':'end',
    class:'fade',style:'animation-delay:.08s'},NAME);
  el(s,'line',{x1:X0-6,y1:y,x2:X1+6,y2:y,stroke:'#E3E2DB','stroke-width':.7,
    class:'fade',style:'animation-delay:.08s'});
  // beads: one per 5 days saved, strung between the two dots
  const n=(WAS-NOW)/5;
  for(let k=0;k<n;k++){
    const t=(k+.5)/n,x=xb+t*(xa-xb),yy=y+(rnd(k+1,3)-.5)*2.6;
    el(s,'circle',{cx:x,cy:yy,r:1.5+rnd(k+2,4)*.9,fill:'#8F8E88',opacity:.85,
      class:'pop',style:`animation-delay:${.3+k*.03}s`});
  }
  el(s,'circle',{cx:xa,cy:y,r:4.2,fill:PAPER,stroke:INK,'stroke-width':1.3,
    class:'pop',style:'animation-delay:.2s'});
  const after=el(s,'circle',{cx:xb,cy:y,r:4.6,fill:INK,
    class:'pop',style:'animation-delay:.6s'});
  tip(after,`${NAME} — ${WAS}天 → ${NOW}天`);
  txt(s,{x:xa+10,y:y-8,'font-size':8.5,'font-weight':700,fill:'#B0AFA9',
    class:'fade',style:'animation-delay:.3s'},WAS+'天');
  txt(s,{x:xb-10,y:y-8,'font-size':10,'font-weight':800,fill:INK,'text-anchor':'end',
    class:'fade',style:'animation-delay:.7s'},NOW+'天');
  txt(s,{x:X0,y:290,'font-size':7,'font-weight':600,fill:'#C6C5BF',class:'fade'},'0天');
  txt(s,{x:X1,y:290,'font-size':7,'font-weight':600,fill:'#C6C5BF','text-anchor':'end',
    class:'fade'},'100天');
  txt(s,{x:200,y:308,'font-size':7,'font-weight':600,fill:'#B0AFA9','text-anchor':'middle',
    'letter-spacing':'.08em',class:'fade',style:'animation-delay:1s'},
    'ONE BEAD = 5 DAYS SAVED · HOLLOW = 传统制作 · INK = AI漫剧');
});
</script>
</body>
</html>
