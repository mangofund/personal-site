<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Palantir：美国商业收入第一次超过政府收入</title>
<style>
body{margin:0;background:#F0EFEB;font-family:Inter,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.grid{max-width:760px;margin:0 auto;padding:24px}
.card{background:#fff;border-radius:24px;padding:28px 30px}
h2{font-size:22px;font-weight:700;color:#1C1C1A;margin:0 0 8px;line-height:1.35}
.sub{font-size:13px;color:#6B6A66;margin-bottom:22px}
.src{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6B6A66;margin-top:20px}
.note{font-size:13px;color:#6B6A66;margin-top:10px;line-height:1.6}
</style>
<meta name="description" content="Palantir：美国商业收入第一次超过政府收入" />
<link rel="canonical" href="https://promangofund.com/charts/earnings-palantir-crossover.html" />
</head>
<body>
<div class="grid"><div class="card">
<h2>Palantir：美国商业收入第一次超过政府收入</h2>
<div class="sub">2026 年第三季度 · 单位：十亿美元 · 柱长与数值成正比，轴从 0 起</div>
<svg viewBox="0 0 700 170" width="100%" role="img" aria-label="Palantir 美国商业与政府收入对比">
<!-- scale: 0.984 -> 480px, x0=150 -->
<g font-size="14">
<text x="0" y="42" font-weight="600" fill="#1C1C1A">美国商业收入</text>
<rect x="150" y="22" width="480" height="26" rx="0" ry="13" fill="#1C1C1A"/>
<text x="622" y="41" text-anchor="end" font-weight="800" fill="#fff">0.984（+148%）</text>
<text x="0" y="112" font-weight="600" fill="#1C1C1A">美国政府收入</text>
<rect x="150" y="92" width="465" height="26" rx="0" ry="13" fill="#B9B8B2"/>
<text x="607" y="111" text-anchor="end" fill="#1C1C1A">0.953（+96%）</text>
<line x1="150" y1="140" x2="630" y2="140" stroke="#DEDDD6" stroke-width="1"/>
<text x="150" y="160" font-size="12" fill="#6B6A66">0</text>
<text x="630" y="160" font-size="12" fill="#6B6A66">0.984</text>
</g>
</svg>
<div class="note">两柱几乎等长，这就是“第一次超过”的真实幅度。另：美国总收入 1.937（+119%）；美国商业剩余履约价值 6.517（+79%）。对应草稿“图表数据点”Palantir 2026 年第三季度一节。</div>
<div class="src">F5 Tick Rows · 数据：草稿图表数据点 · 来源 15、19、23</div>
</div></div>
</body>
</html>
